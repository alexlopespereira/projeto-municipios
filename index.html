<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Os 10 municípios mais populosos em 2022</title>
  <style>
    :root {
      color-scheme: light;
      --marinho: #102746;
      --texto-secundario: #496178;
      --azul: #246bab;
      --fundo: #eef4f9;
      --linha: #d7e3ee;
      --escala: 12000000;
      --colunas: minmax(10rem, 1fr) minmax(0, 3fr) 6.5rem;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fundo);
      color: var(--marinho);
      font: 1rem/1.5 system-ui, "Segoe UI", sans-serif;
    }

    main {
      max-width: 67rem;
      margin: clamp(1rem, 6vw, 4rem) auto;
      padding-inline: clamp(1rem, 4vw, 3rem);
    }

    header {
      text-align: center;
      margin-block-end: 2rem;
    }

    h1 {
      margin: 0;
      color: #c62828;
      font-size: clamp(1.75rem, 4.3vw, 2.75rem);
      line-height: 1.12;
      letter-spacing: -.035em;
      text-wrap: balance;
    }

    header p {
      margin: .75rem 0 0;
      color: var(--texto-secundario);
    }

    .population-chart {
      margin: 0;
      padding: clamp(1rem, 4vw, 2rem);
      border: 1px solid var(--linha);
      border-radius: 1rem;
      background: white;
      box-shadow: 0 .65rem 2rem rgb(16 39 70 / 6%);
    }

    ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .row, .eixo {
      display: grid;
      grid-template-columns: var(--colunas);
      column-gap: 1rem;
      align-items: center;
    }

    .row {
      padding-block: .7rem;
      border-block-end: 1px solid var(--linha);
    }

    .municipio {
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .uf, .graduacao, figcaption {
      color: var(--texto-secundario);
    }

    .uf {
      white-space: nowrap;
      font-size: .875rem;
      font-weight: 500;
    }

    .trilho, .barra {
      display: block;
      height: .875rem;
      border-radius: .2rem;
    }

    .trilho {
      background: var(--fundo);
    }

    .barra {
      width: calc(var(--populacao) / var(--escala) * 100%);
      background: var(--azul);
    }

    .valor {
      text-align: right;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .graduacao {
      grid-column: 2;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      padding-block: .5rem;
      font-size: .8rem;
    }

    .graduacao span:last-child {
      text-align: right;
    }

    figcaption {
      margin-block-start: 1rem;
      border-block-start: 1px solid var(--linha);
      padding-block-start: 1rem;
      font-size: .875rem;
    }

    figcaption p {
      margin: 0;
    }

    figcaption p + p {
      margin-block-start: .35rem;
    }

    a {
      color: #185787;
      text-underline-offset: .16em;
    }

    @media (max-width: 42rem) {
      .row {
        grid-template-columns: minmax(0, 1fr) auto;
        row-gap: .45rem;
      }

      .trilho {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .eixo {
        grid-template-columns: 1fr;
      }

      .graduacao {
        grid-column: 1;
      }
    }

    @media print {
      body {
        background: white;
      }

      .population-chart {
        box-shadow: none;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Os 10 municípios mais populosos em 2022</h1>
      <p>População residente em habitantes, em ordem decrescente</p>
    </header>

    <figure class="population-chart">
      <ol role="list" aria-label="Municípios por população residente">
        <li class="row" data-code="3550308" data-population="11451999">
          <span class="municipio">São Paulo <span class="uf">/ SP</span></span>
          <span class="trilho" aria-hidden="true">
            <span class="barra" style="--populacao: 11451999"></span>
          </span>
          <span class="valor">11.451.999</span>
        </li>

          <span class="municipio">Rio de Janeiro <span class="uf">/ RJ</span></span>

          </span>

        <li class="row" data-code="5300108" data-population="2817381">

        </li>
        <li class="row" data-code="2927408" data-population="2417678">
          <span class="municipio">Salvador <span class="uf">/ BA</span></span>
          <span class="trilho" aria-hidden="true">
            <span class="barra" style="--populacao: 2417678"></span>
          </span>
          <span class="valor">2.417.678</span>
        </li>
        <li class="row" data-code="3106200" data-population="2315560">

          </span>
          <span class="valor">1.773.718</span>
        </li>
        <li class="row" data-code="2611606" data-population="1488920">
          <span class="municipio">Recife <span class="uf">/ PE</span></span>
          <span class="trilho" aria-hidden="true">
            <span class="barra" style="--populacao: 1488920"></span>
          </span>
          <span class="valor">1.488.920</span>
        </li>
        <li class="row" data-code="5208707" data-population="1437366">
          <span class="municipio">Goiânia <span class="uf">/ GO</span></span>
          <span class="trilho" aria-hidden="true">
            <span class="barra" style="--populacao: 1437366"></span>
          </span>
          <span class="valor">1.437.366</span>
        </li>
      </ol>
      <div class="eixo" aria-hidden="true">
        <div class="graduacao">
          <span>0</span>
          <span>6 milhões</span>
          <span>12 milhões</span>
        </div>
      </div>
      <figcaption>
        <p>Fonte dos dados — <a href="https://sidra.ibge.gov.br/tabela/4714">IBGE · Censo Demográfico 2022 · SIDRA, tabela 4714</a>. Os valores vêm de <a href="dados/municipios.csv">dados/municipios.csv</a>.</p>
        <p>Brasília integra a base de nível municipal do IBGE e tem situação administrativa própria.</p>
      </figcaption>
    </figure>
  </main>
</body>
</html>
